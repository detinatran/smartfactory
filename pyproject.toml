[project]
name = "selective-rul"
version = "0.1.0"
description = "Reproducible C-MAPSS experiments for asymmetric-risk selective RUL regression"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "torch>=2.6,<3",
  "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selective_rul"]

[project.scripts]
rul = "selective_rul.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
